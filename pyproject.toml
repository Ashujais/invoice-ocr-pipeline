[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-ocr-pipeline"
version = "0.1.0"
description = "Invoice OCR extraction, validation, SQLite storage, and review reporting pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rapidocr-onnxruntime>=1.3.0",
    "pytesseract>=0.3.10",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
invoice-ocr = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
